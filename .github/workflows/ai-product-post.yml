name: AI Product Publisher

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: "AliExpress product or affiliate link"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get product page
        id: product
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
        run: |
          curl -L --max-time 30 \
            -A "Mozilla/5.0" \
            "$PRODUCT_URL" \
            -o product.html

          echo "Product page downloaded."
          wc -c product.html

      - name: Generate product content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import html
          import re

          api_key = os.environ["GEMINI_API_KEY"]
          product_url = os.environ["PRODUCT_URL"] if "PRODUCT_URL" in os.environ else "${{ inputs.product_url }}"

          with open("product.html", "r", encoding="utf-8", errors="ignore") as f:
              page = f.read()

          page = re.sub(r"<script.*?</script>", " ", page, flags=re.S|re.I)
          page = re.sub(r"<style.*?</style>", " ", page, flags=re.S|re.I)
          page = re.sub(r"<[^>]+>", " ", page)
          page = html.unescape(page)
          page = re.sub(r"\s+", " ", page)

          page = page[:30000]

          prompt = f"""
          You are the product-content writer for Vireonis.

          Create a complete product listing from the AliExpress page information below.

          Requirements:
          - English language.
          - SEO-focused product title.
          - Title should be approximately 50-80 words.
          - Description should be 300-600 words.
          - Do NOT create a separate SEO keywords section.
          - Do not invent specifications, prices, ratings, materials, compatibility,
            shipping claims, discounts, or features that are not supported by the source.
          - Use Markdown headings inside the body.
          - Include a short compatibility/check-before-buying section when relevant.
          - Include the exact affiliate URL provided below.
          - Return ONLY valid JSON.

          JSON format:
          {{
            "name": "...",
            "description": "...",
            "price": "...",
            "category": "...",
            "body": "..."
          }}

          Affiliate URL:
          {product_url}

          AliExpress page text:
          {page}
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {"text": prompt}
                      ]
                  }
              ],
              "generationConfig": {
                  "responseMimeType": "application/json"
              }
          }

          req = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent",
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "x-goog-api-key": api_key,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=120) as response:
              result = json.loads(response.read().decode("utf-8"))

          text = result["candidates"][0]["content"]["parts"][0]["text"]
          product = json.loads(text)

          os.makedirs("content/products", exist_ok=True)

          slug = re.sub(
              r"[^a-z0-9]+",
              "-",
              product["name"].lower()
          ).strip("-")

          if not slug:
              slug = "product"

          filename = f"content/products/{slug}.md"

          frontmatter = f"""---
          name: {json.dumps(product["name"])}
          description: {json.dumps(product["description"])}
          price: {json.dumps(product["price"])}
          affiliate_link: {json.dumps(product_url)}
          category: {json.dumps(product["category"])}
          ---

          {product["body"]}

          ## Affiliate Disclosure

          Vireonis may earn a commission from qualifying purchases.
          """

          with open(filename, "w", encoding="utf-8") as f:
              f.write(frontmatter)

          print(f"Created: {filename}")
          PY

      - name: Commit product
        run: |
          git config user.name "Vireonis AI Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add content/products
          git commit -m "Add AI product post" || echo "No changes to commit"
          git push