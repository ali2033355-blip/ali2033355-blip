name: AI Product Publisher

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: "AliExpress product or affiliate link"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test workflow
        run: |
          echo "AliExpress link received:"
          echo "${{ inputs.product_url }}"

      - name: Create test file
        run: |
          mkdir -p content/products
          cat > content/products/test-product.md <<'EOF'
          ---
          name: Test Product
          description: Automated product publishing test.
          price: USD 0.00
          affiliate_link: ${{ inputs.product_url }}
          category: Test
          ---

          ## Automated Publishing Test

          This is a temporary test post.
          EOF

      - name: Commit product
        run: |
          git config user.name "Vireonis AI Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add content/products/test-product.md
          git commit -m "Test AI product publisher"
          git push